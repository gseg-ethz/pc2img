# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # setuptools_scm derives the version conf.py displays from git tags, and
      # conf.py reads the installed distribution's version, so the build needs
      # the full history and every tag. RTD's default checkout is shallow and
      # would otherwise fall back to a tagless or post-release-shifted version.
      #
      # Unshallow only when the clone is shallow: on a complete clone
      # `git fetch --unshallow` is fatal. There is no `|| true`: a failed
      # unshallow must fail the build, because carrying on would render a
      # wrong version silently.
      #
      # Fetch tags with --force: the floating release tags (v0, v0.10) are
      # moved on every release, and without --force git rejects the update with
      # "would clobber existing tag" and the build exits 1 at release time.
      - if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then git fetch --unshallow; fi
      - git fetch --tags --force
    post_install:
      # Fail the build rather than publish docs with a wrong version: the
      # installed version must not be setuptools_scm's tagless fallback, and the
      # clone must no longer be shallow.
      - python -c "import importlib.metadata as m; v = m.version('pc2img'); print('installed pc2img', v); raise SystemExit(0 if not v.startswith('0.0.') else 'setuptools_scm fell back to its tagless version')"
      - test "$(git rev-parse --is-shallow-repository)" = "false"
    install:
      # `doc` is a PEP 735 dependency-group entry (pyproject.toml
      # [dependency-groups]), not a [project.optional-dependencies] extra, so
      # RTD's usual `python.install: extra_requirements:` mechanism (which
      # PCHandler's .readthedocs.yaml uses) cannot see it at all — that
      # mechanism is extras-only. pip >= 25.1's `--group` install resolves a
      # PEP 735 group and installs the project in one step. The first real
      # RTD build (at the RTD-import checkpoint) is what proves this.
      - python -m pip install --upgrade "pip>=25.1"
      - python -m pip install --group doc .

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true
