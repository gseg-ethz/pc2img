[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "pc2img"
description = "Software to convert point clouds to images with various image representations."
requires-python = "~=3.12,<3.13"
keywords = ["one", "two"]
license = {file = "LICENSE"}
authors = [
	{name = "Nicholas Meyer", email = "meyernic@ethz.ch"},
]
dynamic = ["version", "readme"]
classifiers = [
	"Programming Language :: Python :: 3"
]
dependencies = [
	"pchandler ~= 2.1",
	"GSEGUtils ~= 0.5",
	"joblib ~= 1.5",
	"numpy ~= 2.0",
	"imageio ~= 2.31",
	"joblib ~= 1.3",
	"Pillow ~= 10.0",
	"pydantic ~= 2.11",
	"scipy ~= 1.14",
	"typing-extensions ~= 4.9",
	"tifffile[all] ~= 2024.1",
	"opencv-python ~= 4.0",
]

[tool.setuptools.dynamic]
readme = {file = ["README.rst"]}

[tool.setuptools_scm]
write_to = "src/pc2img/_version.py"
local_scheme = "no-local-version"
version_scheme = "post-release"
tag_regex = '^v?(?P<version>\d+\.\d+\.\d+(?:(?:a|b|rc)\d+)?(?:\.post\d+)?(?:\.dev\d+)?)$'
git_describe_command = "git describe --dirty --tags --long --match 'v[0-9]*.[0-9]*.[0-9]*'"

[project.urls]
homepage = "https://gseg.igp.ethz.ch/"
documentation = "https://google.com"
#repository = "https://gseg-ethz.github.com/DeSpAn"

#[project.scripts]
#DeSpAn = "DeSpAn.cli:main"

[project.optional-dependencies]
doc = ["sphinx ~= 5.1"]
dev = [
	"black ~= 23.10",
	"pytest",
    "memory_profiler",
]
cuda12 = ["pchandler[cuda12]"]
cuda11 = ["pchandler[cuda11]"]
