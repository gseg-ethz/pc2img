name: CI

# Continuous integration: produces the three named required status checks — the
# lint gate, the test suite and the warnings-as-errors docs build — on every
# pull request, on every push to the integration branch, and nightly against the
# default branch. The nightly heartbeat IS this workflow rather than a second
# copy of it, so there is no duplicated job definition to drift.
#
# The three job `name:` values below ARE ruleset required-status-check context
# strings (`.github/rulesets/main.json`, `.github/rulesets/develop.json`). What
# MUST stay true, and why:
#
#   - NO job here may carry a job-level `if:`, and NO filter key (`paths:`,
#     `paths-ignore:`, `branches:`, ...) may appear under `pull_request:`.
#     GitHub counts a `skipped` conclusion among the SATISFYING ones and a
#     filtered-out run never reports at all, so either shape greens the gate
#     having executed nothing — and the filtered shape strands the pull request
#     on a check that will never arrive, with no override available under
#     `bypass_actors: []`. Conditionality belongs on STEPS. Assertions A1 and A5
#     in `.github/scripts/check_ci_config.py` fail the build if either returns,
#     when the config self-inspection component is applied; otherwise keep
#     this by hand: never add a job-level `if:` to any job here, and never
#     add a `paths:`, `paths-ignore:` or `branches:` key under
#     `on.pull_request`.
#   - NO required-context job may depend on another job. A `needs:` edge
#     between two required contexts is a pure fail-fast convenience, never a data
#     dependency, and dropping it removes the skip-propagation path structurally
#     rather than guarding it. Assertion A6 in `.github/scripts/check_ci_config.py`
#     fails the build on this shape when the config self-inspection component is
#     applied; otherwise keep this by hand: never add a `needs:` edge between
#     two required-context jobs when editing this file.
#   - RENAMING a job is a coordinated change across this file and EVERY ruleset
#     payload naming that context: the `name:` and the payloads move in ONE
#     commit, or the protected branch requires a context nothing produces and
#     becomes unmergeable BY ANYONE under `bypass_actors: []`.
#   - `push:` deliberately does NOT list the protected branch. The post-merge
#     duplicate run is retired in favour of
#     `strict_required_status_checks_policy: true`, and release automation
#     triggers on a push to the protected branch DIRECTLY. Those changes ship in
#     ONE commit or the release chain stops SILENTLY, with nothing red.
#   - The lint job holds a READ content scope only. Assertion A7 fails the build
#     the moment a write scope is added back, when the config self-inspection
#     component is applied; otherwise keep this by hand: leave the lint job's
#     `permissions:` read-only (`contents: read`, `pull-requests: read`)
#     whenever you edit it.
#   - ALL THREE required-context jobs carry the release-artifact fast path. Each
#     resolves the `classify-changes` composite immediately after its OWN
#     checkout and gates EVERY subsequent step on the result, so the cost
#     paragraph below applies verbatim to all three — it is one property of one
#     mechanism, not three separate ones, and removing the fast path from one job
#     does not silently disarm it in the others.
#   - THE COST THIS ACCEPTS, stated here rather than discovered later: on a
#     release-artifact-only pull request the whole-tree pre-commit hooks and the
#     read-only gate scripts no longer run, so generated content that would have
#     failed them lands on the protected branch and reddens the NEXT ordinary
#     pull request's whole-tree run instead. That failure is loud, cheap, and
#     lands before no publish. It is accepted deliberately. The counterweight
#     that makes it safe: the two assertions that actually stand between a
#     head-ref edit and the protected branch — A5 (no job-level condition on a
#     required context) and A6 (no conditional dependency) — are ALSO evaluated
#     un-skippably by `integrity.yml`, when the continuous-enforcement component
#     is applied. That workflow fires from the BASE repository's side on every
#     pull request into the protected branch, checks out the base ref with no
#     `ref:` input, and runs `assert_no_skip.py` against a hybrid tree — widening
#     the fast path here does not weaken either of them where that component
#     ships.
#     (The base-repository pull-request trigger keyword is deliberately NOT
#     spelled out in this file: assertion A2, when it ships as part of the
#     config self-inspection component, is a raw-text scan over the workflows
#     directory and excepts exactly one path, which is not this one.)
#   - NO `concurrency:` key belongs in this file, at workflow level or on any
#     job. With the fast path leaving nothing expensive to re-run there is
#     nothing worth cancelling, and a cancelled run does not satisfy a required
#     status check anyway.
#
# The lint job is where a repository adds its OWN read-only gate scripts. Add
# them as steps carrying the same fast-path condition as their neighbours; never
# as a new job, because a new job either becomes a required context that must be
# added to every ruleset payload in the same commit, or an unrequired one whose
# failure blocks nothing.

on:
  pull_request:
  push:
    branches: [develop-gsd]
  schedule:
    # Pick a slot that does not collide with the repository's other scheduled
    # workflows — two schedules sharing a slot queue behind each other on the
    # same runner pool and the second one's timing stops meaning what it says.
    - cron: '0 5 * * *'

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read   # the `classify` step below reads the pull request's file list

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          # NOTE: the `ref:` and `token:` inputs are intentionally ABSENT.
          # Nothing in this job pushes — it runs pre-commit and read-only gate
          # scripts — so a head-branch checkout buys nothing, and on a fork pull
          # request it resolves to a branch name that does not exist in this
          # repository. Leaving them out fixes that latent failure as a side
          # effect of the least-privilege narrowing.
          fetch-depth: 0   # setuptools_scm reads tags

      # The release-artifact fast path. MUST follow the checkout: a local
      # composite is resolved from the runner filesystem, so it does not exist
      # until the repository is on disk. The guard goes on STEPS, never on the
      # job — a job-level condition would green this required context having
      # executed nothing (A5).
      - id: classify
        uses: ./.github/actions/classify-changes

      # The environment install is gated too, not just the terminal steps: the
      # install is the bulk of the wall clock here, so gating only the terminal
      # steps would buy almost nothing.
      - if: steps.classify.outputs.release-artifacts-only != 'true'
        uses: ./.github/actions/setup-python-deps

      - name: Run pre-commit
        if: steps.classify.outputs.release-artifacts-only != 'true'
        shell: bash
        run: |
          # The uv venv the composite above built ships no pip; pre-commit
          # comes from the locked `dev` dependency group instead, already on
          # PATH via that composite's venv/bin prepend — no separate install.
          pre-commit run --all-files

      - name: Check publish gate
        if: steps.classify.outputs.release-artifacts-only != 'true'
        shell: bash
        run: |
          # This script is shipped by the OPTIONAL release component. A
          # repository that does not assemble that component has no publish
          # chain to gate, so the step reports that and moves on rather than
          # failing a required context on an absent optional feature. Core
          # accommodates the optional component by ABSENCE here; the optional
          # component ships no edit to this file.
          #
          # The middle branch is the one that matters. "Script absent" must not
          # be indistinguishable from "nothing to gate": if the publish
          # workflows ARE present and only the gate script is missing, the
          # containment check that keeps a publish step out of every other
          # workflow has silently stopped running, and this required context
          # would report success having checked nothing. That is a fail-open, so
          # it is a hard failure here.
          if [ -f .github/scripts/check_publish_gate.py ]; then
            python .github/scripts/check_publish_gate.py
          # Both suffixes: GitHub reads `.yaml` workflows too, so probing only
          # `.yml` would let the SAME rename hide a rogue publish workflow from
          # the gate AND hide the publish workflows from this guard, which is the
          # thing that notices the gate has gone missing. Each suffix is probed
          # by its OWN `ls`, joined with `||`: `ls` reports a non-zero status
          # when ANY operand is unmatched, so a single `ls` over both globs
          # fails on the ordinary repository that has only the `.yml` file and
          # falls through to the branch below that reports nothing to gate.
          elif ls .github/workflows/publish-*.yml >/dev/null 2>&1 || ls .github/workflows/publish-*.yaml >/dev/null 2>&1; then
            echo "::error::publish workflow(s) exist but .github/scripts/check_publish_gate.py does not — the publish containment gate would silently stop running. Assemble the release component completely, or remove the publish workflows."
            exit 1
          else
            echo "no release component assembled — no publish gate to check"
          fi

      - name: Check CI config
        if: steps.classify.outputs.release-artifacts-only != 'true'
        shell: bash
        run: |
          # This script ships in the OPTIONAL config self-inspection component;
          # core accommodates it by ABSENCE here, the same shape as "Check
          # publish gate" above. The middle branch is the one that matters:
          # "script absent" must not be indistinguishable from "nothing to
          # inspect" -- if a related file (its own test suite, the
          # continuous-enforcement component's assert_no_skip.py or
          # integrity.yml) IS present while the checker itself is not, the
          # continuous-enforcement component was assembled without the config
          # self-inspection component it depends on, and that is a
          # half-assembled tier, not an absent one.
          if [ -f .github/scripts/check_ci_config.py ]; then
            python .github/scripts/check_ci_config.py
          elif [ -f .github/scripts/test_check_ci_config.py ] || [ -f .github/scripts/assert_no_skip.py ] || [ -f .github/workflows/integrity.yml ]; then
            echo "::error::the config self-inspection component looks half-assembled -- a related file (test_check_ci_config.py, assert_no_skip.py or integrity.yml) exists but .github/scripts/check_ci_config.py does not. Assemble the config self-inspection component completely, or remove the related files."
            exit 1
          else
            echo "config self-check not configured; skipping"
          fi

      - name: Run .github/scripts unit tests
        if: steps.classify.outputs.release-artifacts-only != 'true'
        shell: bash
        run: pytest .github/scripts/ -q

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read   # the `classify` step below reads the pull request's file list

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          # setuptools_scm derives the version from tags during the editable
          # install the setup-python-deps composite performs below; the
          # `lint` and `docs` jobs already carry this for the same reason.
          fetch-depth: 0   # setuptools_scm reads tags

      # The release-artifact fast path. MUST follow the checkout, same reason as
      # in `lint` above.
      #
      # COST, recorded rather than glossed: on a release-artifact-only pull
      # request this REQUIRED context reports success having executed
      # essentially nothing. That is the same silhouette as an unconditional
      # status-shim job, and the distinction is real but narrow — this skip is
      # conditional on MEASURED content, it fails safe in five independent ways
      # (see the composite), and any path outside the allowlist runs everything.
      # The guard is on STEPS, never on the job, so the conclusion is a genuine
      # `success` rather than a `skipped` that merely counts as satisfying (A5).
      - id: classify
        uses: ./.github/actions/classify-changes

      # The skip sits at the dependency install rather than at the test run: the
      # install is the bulk of the wall clock, so skipping only the test command
      # would buy almost nothing.
      - if: steps.classify.outputs.release-artifacts-only != 'true'
        uses: ./.github/actions/setup-python-deps

      - name: Type check (informational)
        id: typecheck
        if: steps.classify.outputs.release-artifacts-only != 'true'
        continue-on-error: true
        uses: jakebailey/pyright-action@8ec14b5cfe41f26e5f41686a31eb6012758217ef  # v3.0.2
        with:
          annotate: warnings
          # NOTE: leave the `warnings` input UNSET — setting it to `true` would
          # ESCALATE warnings to exit 1. The warn-only semantics come from the
          # step-level `continue-on-error` flag, not from this action's inputs.
          working-directory: .
          # Point the type check at the locked uv venv explicitly, so it
          # resolves imports (pchandler, GSEGUtils, ...) from the environment
          # the composite above built rather than whatever ambient Python the
          # action itself falls back to.
          python-path: .venv/bin/python

      - name: Upload type-check report
        if: always() && steps.classify.outputs.release-artifacts-only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: typecheck-report-${{ github.run_id }}
          path: .pyright-report.json
          if-no-files-found: ignore

      - name: Run tests
        if: steps.classify.outputs.release-artifacts-only != 'true'
        # --cov-branch --cov-fail-under=55: coverage floor carried forward
        # from the previous CI workflow, added on top of the upstream
        # template — the template's own Tests job has no coverage
        # gate. Branch coverage matches pyproject.toml's [tool.coverage.run]
        # config.
        run: pytest -m "not benchmark" --cov=pc2img --cov-report=xml:coverage-unit.xml --cov-branch --cov-fail-under=55

      # Coverage upload is optional tooling, not part of the gate: this action
      # does not set `fail_ci_if_error`, so a missing token or an upload failure
      # cannot redden this required context. Delete the step if the repository
      # does not use a coverage service.
      - name: Upload coverage
        if: success() && steps.classify.outputs.release-artifacts-only != 'true'
        uses: codecov/codecov-action@8cad3ba95e5920c42f44492e54bc9639cba47959  # v6.0.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-unit.xml
          flags: unit

  docs:
    name: Docs (sphinx -W)
    runs-on: ubuntu-latest

    # This block is a NARROWING, not a grant. A job declaring no permissions at
    # all inherits the repository default, which is wider than anything here
    # needs.
    permissions:
      contents: read
      pull-requests: read   # the `classify` step below reads the pull request's file list

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          # Required whenever the documentation build reads the INSTALLED
          # distribution metadata, because setuptools_scm derives that from
          # TAGS. Without it, checkout defaults to a depth-1 tagless clone, the
          # derivation falls back to a `0.0.`-prefixed placeholder, and this
          # required context validates a documentation set whose version is
          # wrong while reporting success — `-W` promotes SPHINX warnings, and
          # setuptools_scm's shallow-clone complaint is a Python UserWarning
          # outside that surface entirely.
          fetch-depth: 0   # setuptools_scm reads tags

      # The release-artifact fast path. MUST follow the checkout, same reason as
      # in `lint` and `tests` above.
      - id: classify
        uses: ./.github/actions/classify-changes

      # This job builds its OWN environment on purpose. If the documentation
      # build is ever extracted from another job, checkout + composite + the
      # documentation extra are all required here — it is not a two-line
      # cut-and-paste.
      - if: steps.classify.outputs.release-artifacts-only != 'true'
        uses: ./.github/actions/setup-python-deps

      - name: Build docs (warnings as errors)
        if: steps.classify.outputs.release-artifacts-only != 'true'
        working-directory: .
        run: |
          # The source/build directories below are this repository's own
          # Sphinx conventions rather than parameters of this kit — match
          # them to the documentation layout. pc2img's doc tooling is a PEP
          # 735 dependency group (`[dependency-groups] doc`), not a
          # `[project.optional-dependencies]` extra, so the kit's own
          # extras-based install line would install nothing extra; install
          # from the locked env instead (consistent with the uv-based setup
          # composite used elsewhere in this workflow).
          uv sync --frozen --group doc

          # Assert the derivation instead of trusting the green. The
          # `fetch-depth: 0` above is the fix; this is the check that would have
          # CAUGHT its absence, and it is here because nothing else can: a
          # degraded version builds clean and reports success. The distribution
          # name is read from pyproject.toml rather than hard-coded so this block
          # needs no parameter of its own.
          python - <<'PY'
          import importlib.metadata
          import pathlib
          import tomllib

          name = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["name"]
          version = importlib.metadata.version(name)
          print(f"docs version: {name} {version}")
          if version.startswith("0.0."):
              print(
                  f"::error::setuptools_scm derived {version!r} for {name}, which is its "
                  "TAGLESS FALLBACK rather than a real version — the checkout lost its tags. "
                  "The documentation would render the wrong version and still pass -W."
              )
              raise SystemExit(1)
          PY

          sphinx-build -W --keep-going -b html docs/source docs/_build/html
